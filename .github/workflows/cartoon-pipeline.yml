# 🎬 FULLY AUTOMATED CARTOON CHANNEL - GitHub Actions Workflow
# =============================================================
# This runs COMPLETELY FREE on GitHub's servers!
# No laptop needed. Runs on schedule automatically.
#
# SETUP:
# 1. Push this repo to GitHub
# 2. Add these SECRETS in GitHub repo Settings → Secrets → Actions:
#    - YOUTUBE_CLIENT_SECRET: (base64 encoded client_secret.json)
#    - YOUTUBE_TOKEN: (base64 encoded token.pkl after first auth)
#    - CONFIG_YAML: (base64 encoded config.yaml)
# 3. Enable Actions in repo Settings
# 4. It runs automatically every week!
#
# TO ENCODE SECRETS (run locally once):
#   base64 -w 0 client_secret.json | pbcopy  # Mac
#   base64 -w 0 client_secret.json | clip    # Windows
#   base64 -w 0 token.pkl | pbcopy
#   base64 -w 0 config.yaml | pbcopy

name: 🎬 Weekly Cartoon Pipeline

on:
  schedule:
    # Runs every Monday at 10:00 UTC (adjust for your timezone)
    - cron: '0 10 * * 1'  # Monday 10 AM UTC
  workflow_dispatch:      # Manual trigger from GitHub UI
    inputs:
      week:
        description: 'Week number (1-52, empty = auto)'
        required: false
        type: string
      force:
        description: 'Force re-run even if done'
        required: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours max (GitHub free limit)

    steps:
      # ─── CHECKOUT ───
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─── SETUP PYTHON ───
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ─── INSTALL SYSTEM DEPENDENCIES ───
      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            inkscape

      # ─── INSTALL PYTHON DEPENDENCIES ───
      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ─── VALIDATE SECRETS ───
      - name: ✅ Validate required secrets
        run: |
          if [ -z "${{ secrets.YOUTUBE_CLIENT_SECRET }}" ]; then
            echo "❌ YOUTUBE_CLIENT_SECRET secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.YOUTUBE_TOKEN }}" ]; then
            echo "❌ YOUTUBE_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.CONFIG_YAML }}" ]; then
            echo "❌ CONFIG_YAML secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      # ─── DECODE SECRETS ───
      - name: 🔐 Decode secrets
        run: |
          # Trim whitespace and decode
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET }}" | tr -d '\r\n ' | base64 -d > client_secret.json
          echo "${{ secrets.YOUTUBE_TOKEN }}" | tr -d '\r\n ' | base64 -d > token.pkl
          echo "${{ secrets.CONFIG_YAML }}" | tr -d '\r\n ' | base64 -d > config.yaml

          # Verify decoded files
          echo "Verifying decoded files..."
          [ -s client_secret.json ] && echo "✅ client_secret.json OK" || { echo "❌ client_secret.json empty"; exit 1; }
          [ -s token.pkl ] && echo "✅ token.pkl OK" || { echo "❌ token.pkl empty"; exit 1; }
          [ -s config.yaml ] && echo "✅ config.yaml OK" || { echo "❌ config.yaml empty"; exit 1; }

      # ─── GENERATE ASSETS (if not cached) ───
      - name: 🎨 Generate assets
        run: python generate_assets.py

      # ─── VERIFY ASSETS ───
      - name: ✅ Verify assets generated
        run: |
          echo "Checking character assets..."
          ls -la assets/characters/
          echo "Checking background assets..."
          ls -la assets/backgrounds/
          echo "Checking audio assets..."
          ls -la assets/audio/
          # Verify all 5 character SVGs exist
          for char in bip gloop pip zap snooze; do
            if [ ! -f "assets/characters/${char}.svg" ]; then
              echo "❌ Missing: assets/characters/${char}.svg"
              exit 1
            fi
          done
          # Verify all 4 background SVGs exist
          for bg in room park kitchen bedroom; do
            if [ ! -f "assets/backgrounds/${bg}.svg" ]; then
              echo "❌ Missing: assets/backgrounds/${bg}.svg"
              exit 1
            fi
          done
          echo "✅ All assets verified"

      # ─── DETERMINE WEEK ───
      - name: 📅 Determine week number
        id: week
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
          else
            python -c "
import datetime
import yaml
import sys

with open('config.yaml', 'r', encoding='utf-8') as f:
    cfg = yaml.safe_load(f) or {}

start_str = cfg.get('automation', {}).get('start_date', '2025-01-06')
start = datetime.datetime.strptime(start_str, '%Y-%m-%d')
now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
week = ((now - start).days // 7) + 1
week = max(1, min(week, 52))
print(f'week={week}')
" >> "$GITHUB_OUTPUT"
          fi

      # ─── GENERATE SCRIPTS ───
      - name: 📝 Generate scripts
        run: python generate_scripts.py --week ${{ steps.week.outputs.week }}

      # ─── GENERATE AUDIO ───
      - name: 🎙️ Generate voiceovers (Edge TTS)
        run: python generate_audio.py --week ${{ steps.week.outputs.week }}

      # ─── RENDER VIDEOS ───
      - name: 🎬 Render videos (MoviePy)
        run: |
          # Retry up to 2 times for transient rendering issues
          for attempt in 1 2; do
            echo "🎬 Render attempt $attempt..."
            if python animate.py --week ${{ steps.week.outputs.week }}; then
              echo "✅ Render succeeded"
              break
            else
              echo "⚠️ Render failed, attempt $attempt"
              if [ $attempt -eq 2 ]; then
                echo "❌ All render attempts failed"
                exit 1
              fi
              sleep 30
            fi
          done
        env:
          MOVIE_THREADS: 2

      # ─── UPLOAD TO YOUTUBE ───
      - name: 📤 Upload to YouTube
        run: python upload.py --week ${{ steps.week.outputs.week }}

      # ─── CLEANUP ───
      - name: 🧹 Cleanup temp files
        if: always()
        run: |
          rm -rf temp/
          find output -name "*.png" -delete
          find output -name "*.wav" -delete

      # ─── NOTIFICATION ───
      - name: 📢 Notify on failure
        if: failure()
        env:
          WEEK: ${{ steps.week.outputs.week || 'unknown' }}
        uses: actions/github-script@v7
        with:
          script: |
            const week = process.env.WEEK || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Pipeline failed - Week ${week}`,
              body: `Automated cartoon pipeline failed. Check workflow run: ${runUrl}`,
              labels: ['bug', 'pipeline-failure']
            });

